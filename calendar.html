<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="تقويمي - أدوات التاريخ والتقويم والزكاة وحساب العمر والمناسبات"><title>التقويم الميلادي | تقويمي</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html"><span class="logo-icon">📅</span>تقويمي</a><nav><a href="index.html">الرئيسية</a><a href="calendar.html">الميلادي</a><a href="hijri.html">الهجري</a><a href="coptic.html">القبطي</a><a href="age.html">حساب العمر</a><a href="zakat.html">الزكاة</a><a href="occasions.html">المناسبات</a></nav></div></header><main class="page-shell"><section class="page-head"><div class="container"><span class="badge">تقويم تفاعلي</span><h1>التقويم الميلادي</h1><p>اختر الشهر وشاهد الأيام، مع عرض التاريخ الهجري لكل يوم عند توفر الاتصال بالإنترنت.</p><div id="calStatus" class="api-status">● جاري تحميل البيانات</div></div></section><section><div class="container"><div class="form-card"><div class="month-bar"><button class="icon-btn" id="prev">الشهر السابق</button><div class="month-title" id="monthTitle">--</div><button class="icon-btn" id="next">الشهر التالي</button></div><div class="calendar-grid" id="calendarGrid"></div></div></div></section></main><footer><div class="container footer"><div><strong>📅 تقويمي</strong><div class="footer-links"><a href="privacy.html">سياسة الخصوصية</a><a href="terms.html">شروط الاستخدام</a><a href="copyright.html">حقوق الملكية</a><a href="about.html">من نحن</a></div></div><small>© 2026 تقويمي — جميع الحقوق محفوظة</small></div></footer><script>const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];const weekdays=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let view=new Date();view.setDate(1);async function renderCal(){const y=view.getFullYear(),m=view.getMonth();document.getElementById('monthTitle').textContent=months[m]+' '+y;const g=document.getElementById('calendarGrid');g.innerHTML=weekdays.map(x=>'<div class="weekday">'+x+'</div>').join('');const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)g.insertAdjacentHTML('beforeend','<div class="day-cell empty"></div>');for(let d=1;d<=days;d++){const cell=document.createElement('div');cell.className='day-cell';const date=new Date(y,m,d);if(date.toDateString()===new Date().toDateString())cell.classList.add('today-cell');cell.innerHTML='<div class="day-num">'+d+'</div><div class="hijri-small" id="h'+d+'">...</div>';g.appendChild(cell);fetch('https://api.aladhan.com/v1/gToH/'+String(d).padStart(2,'0')+'-'+String(m+1).padStart(2,'0')+'-'+y+'?calendarMethod=MATHEMATICAL').then(r=>r.json()).then(j=>{document.getElementById('h'+d).textContent=j.data.hijri.day+' '+j.data.hijri.month.ar}).catch(()=>{document.getElementById('h'+d).textContent='ميلادي'});}document.getElementById('calStatus').textContent='● يتم تحديث التاريخ الهجري تلقائيًا عند الاتصال';}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};renderCal();</script></body></html>
